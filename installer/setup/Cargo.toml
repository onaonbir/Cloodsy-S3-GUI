[package]
name = "cloodsy_s3_gui_setup"
version = "1.0.0"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true
description = "Cloodsy S3 GUI's Windows setup and uninstaller (installer/README.md)"

[[bin]]
name = "cloodsy-s3-gui-setup"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
cloodsy_s3_gui_pack = { path = "../pack" }

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
mslnk = "0.1"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_Globalization"] }

[features]
# Release builds serve the embedded page (dist-setup/).
custom-protocol = ["tauri/custom-protocol"]

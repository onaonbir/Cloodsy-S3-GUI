[package]
name = "cloodsy_s3_gui_pack"
version = "1.0.0"
edition.workspace = true
license-file.workspace = true
repository.workspace = true
publish.workspace = true
description = "The payload of Cloodsy S3 GUI's Windows setup: the app's files appended to the setup exe"

[[bin]]
name = "cloodsy-s3-gui-pack"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zstd = "0.13"

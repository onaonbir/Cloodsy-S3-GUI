name: CI

# Static analysis and tests on every push and pull request. The release
# workflow runs the same checks before it builds anything.

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "flutter_version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      # nativeapi (window_manager 0.7) compiles its native code through a
      # build hook, even for `flutter test`; on Linux it needs GTK 3, X11
      # and Xi headers plus a C/C++ toolchain.
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libx11-dev libxi-dev xvfb
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.meta.outputs.flutter_version }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --fatal-infos
      # The native library initialises GTK when it loads; without a display
      # the test process crashes on exit, so run under a virtual X server.
      - run: xvfb-run -a flutter test

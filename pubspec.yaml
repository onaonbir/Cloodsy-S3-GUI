name: cloodsy_s3_gui
description: "Cloodsy S3 Admin GUI"
publish_to: 'none'
version: 2.0.0+3

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0
  provider: ^6.1.5
  http: ^1.6.0
  path: ^1.9.0
  flutter_secure_storage: ^11.2.0
  path_provider: ^2.1.6
  window_manager: ^0.7.0
  lucide_icons_flutter: ^4.0.3
  file_selector: ^1.0.3
  desktop_drop: ^0.8.4
  crypto: ^3.0.8
  nativeapi: ^0.6.0
  pdfrx: ^2.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  package_rename_plus: ^1.11.0

  # Icon generation
  icons_launcher: ^3.1.0

  # Windows MSIX installer packaging (used by the release workflow)
  msix: ^3.18.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL-PlusJakartaSans.txt
    - assets/fonts/OFL-JetBrainsMono.txt
  # Bundled so the UI never depends on fetching fonts at runtime (admin
  # consoles often run on machines without internet access). Both are SIL OFL
  # licensed; the licence texts are in assets/fonts/.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500

# MSIX installer config (Windows). store: false self-signs a test certificate
# for sideloading — users trust the bundled .cer once, then install the .msix.
msix_config:
  display_name: Cloodsy S3 GUI
  publisher_display_name: OnaOnbir
  publisher: CN=OnaOnbir
  identity_name: com.onaonbir.cloodsys3gui
  msix_version: 2.0.0.0
  logo_path: assets/brand/app-icon.png
  capabilities: internetClient
  store: false

name: cloodsy_s3_gui
description: "Cloodsy S3 Admin GUI"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  provider: ^6.1.5
  http: ^1.6.0
  flutter_secure_storage: ^10.0.0
  path_provider: ^2.1.5
  google_fonts: ^8.0.2
  window_manager: ^0.5.1
  lucide_icons_flutter: ^3.1.11



dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  package_rename_plus: ^1.11.0

  # Icon generation
  icons_launcher: ^3.1.0

  # Windows MSIX installer packaging (used by the release workflow)
  msix: ^3.16.0

flutter:
  uses-material-design: true
  assets:
    - assets/logos/

# MSIX installer config (Windows). store: false self-signs a test certificate
# for sideloading — users trust the bundled .cer once, then install the .msix.
msix_config:
  display_name: Cloodsy S3 GUI
  publisher_display_name: OnaOnbir
  publisher: CN=OnaOnbir
  identity_name: com.onaonbir.cloodsys3gui
  msix_version: 1.0.0.0
  logo_path: assets/logos/logo_1.png
  capabilities: internetClient
  store: false
